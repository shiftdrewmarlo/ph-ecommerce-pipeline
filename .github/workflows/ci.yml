name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Unit and integration tests
        run: pytest -q

      - name: Run the pipeline end to end (fails if any blocking data quality check fails)
        run: python -m src.pipeline --regenerate --orders 10000
